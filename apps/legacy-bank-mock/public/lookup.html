<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Member Lookup — CoreBank</title>
  <style>
    body { font-family: "Times New Roman", serif; background: #c0c0c0; margin: 0; }
    .banner { background: #000080; color: #fff; padding: 8px 12px; font-weight: bold; }
    table.layout { width: 100%; border-collapse: collapse; }
    td.nav { width: 180px; background: #d4d0c8; vertical-align: top; border-right: 2px solid #808080; padding: 10px; }
    td.nav a { display: block; color: #000080; margin: 6px 0; }
    td.main { padding: 12px; background: #ffffff; vertical-align: top; }
    fieldset { border: 2px groove #808080; padding: 12px; }
    .err { color: #cc0000; font-weight: bold; }
    iframe.result { width: 100%; height: 280px; border: 2px inset #808080; background: #f8f8f8; }
  </style>
</head>
<body>
  <div class="banner">CoreBank — Member Lookup</div>
  <table class="layout" role="presentation">
    <tr>
      <td class="nav">
        <b>Menu</b><br/>
        <a href="lookup.html">Member Lookup</a>
        <a href="open-account.html">Open Sub-Account</a>
        <a href="index.html">Home</a>
      </td>
      <td class="main">
        <h2>Member Lookup</h2>
        <form id="lookupForm" action="javascript:void(0)">
          <fieldset>
            <legend>Search Criteria</legend>
            <table role="presentation">
              <tr>
                <td><label for="memberIdField">Member ID:</label></td>
                <td><input type="text" id="memberIdField" name="member_id" size="20" /></td>
              </tr>
              <tr>
                <td></td>
                <td>
                  <button type="submit">Search</button>
                  <button type="button" id="clearBtn">Clear</button>
                </td>
              </tr>
            </table>
          </fieldset>
        </form>
        <p id="validationMsg" class="err" hidden></p>
        <h3>Results</h3>
        <!-- Hostile: results live inside an iframe -->
        <iframe class="result" id="resultsFrame" name="resultsFrame" title="Lookup Results" src="about:blank"></iframe>
      </td>
    </tr>
  </table>
  <script src="bank-logic.js"></script>
  <script>
    document.getElementById('lookupForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var id = document.getElementById('memberIdField').value.trim();
      var msg = document.getElementById('validationMsg');
      if (!id) {
        msg.textContent = 'Validation Error: Member ID is required.';
        msg.hidden = false;
        return;
      }
      if (!/^\d{4,8}$/.test(id)) {
        msg.textContent = 'Validation Error: Member ID must be 4–8 digits.';
        msg.hidden = false;
        return;
      }
      msg.hidden = true;
      document.getElementById('resultsFrame').src = 'results.html?memberId=' + encodeURIComponent(id);
    });
    document.getElementById('clearBtn').addEventListener('click', function () {
      document.getElementById('memberIdField').value = '';
      document.getElementById('validationMsg').hidden = true;
      document.getElementById('resultsFrame').src = 'about:blank';
    });
  </script>
</body>
</html>
